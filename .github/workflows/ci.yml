name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: RuboCop
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop --format github

  # ── Test ────────────────────────────────────────────────────────────────────
  test:
    name: RSpec / Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3"]

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run RSpec with coverage
        run: bundle exec rspec
        env:
          COVERAGE: "true"
          CI: "true"

      - name: Upload coverage report (Ruby 3.1 only)
        if: matrix.ruby == '3.1'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Check minimum coverage
        if: matrix.ruby == '3.1'
        run: |
          COVERED=$(ruby -e "
            require 'json'
            data = JSON.parse(File.read('coverage/.last_run.json'))
            pct = data.dig('result', 'line') || data.dig('result', 'covered_percent') || 0
            puts pct.round(2)
          ")
          echo "Coverage: ${COVERED}%"
          ruby -e "exit(1) if ${COVERED}.to_f < 80" || {
            echo "::warning::Coverage ${COVERED}% is below the 80% threshold."
          }

      - name: Extract coverage percentage for badge
        if: matrix.ruby == '3.1'
        id: coverage
        run: |
          PCT=$(ruby -e "
            require 'json'
            data = JSON.parse(File.read('coverage/coverage.json'))
            puts data.dig('metrics', 'covered_percent').round(2)
          ")
          echo "pct=${PCT}%" >> "$GITHUB_OUTPUT"

      - name: Generate coverage badge
        if: matrix.ruby == '3.1' && github.ref == 'refs/heads/main'
        uses: ernanej/badge-generator@main
        with:
          name: ${{ steps.coverage.outputs.pct }}
          prefix: coverage
          path: .github/badges/coverage.svg
          github_token: ${{ secrets.GITHUB_TOKEN }}
